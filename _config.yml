title: openSUSE
description: Learn about the openSUSE distributions and download them for free
email: admin@opensuse.org
copyright: © 2026 openSUSE contributors
baseurl: ""
url: https://get.opensuse.org
github_url: https://github.com/openSUSE/landing-page/
weblate_url: https://l10n.opensuse.org/
piwik_site_id: 64

navbar_links:
  - link: https://news.opensuse.org/
    translation_key: topnav_news
  - link: https://get.opensuse.org/desktop/
    translation_key: topnav_desktop_os
  - link: https://get.opensuse.org/server/
    translation_key: topnav_server_os

# Only edit below if you know what you are doing!
defaults:
  - scope:
      path: "*.html"
    values:
      layout: "default"
  - scope:
      path: "*.md"
    values:
      layout: "markdown"
  - scope:
      path: "*.markdown"
    values:
      layout: "markdown"

navbar_class: navbar-expand-md sticky-top

plugins:
  - jekyll-redirect-from
  - jekyll-locale
theme: jekyll-theme-opensuse
markdown: kramdown

localization:
  mode: auto
  locale: en
  locales_set:
    en:
      name: English
    ca:
      name: Català
    cs:
      name: Čeština
    de:
      name: Deutsch
    es:
      name: Español
    kab:
      name: Kabyle
    hu:
      name: Magyar
    nl:
      name: Nederlands
    nb_NO:
      name: Norsk bokmål
    pt_PT:
      name: Português (Portugal)
    pt_BR:
      name: Português (Brasil)
    sk:
      name: Slovenčina
    sv:
      name: Svenska
    tr:
      name: Türkçe
    be:
      name: Беларуская
    ru:
      name: Русский
    ja:
      name: 日本語
    ar:
      name: العربية

exclude: [README.md, LICENSE, Gemfile, Gemfile.lock, vendor, Rakefile]
